autoRelease: false
autoGeneratePrompts: true
validationPrompt: docs/dod.md
# Makefile.precommit includes $(ROOTDIR)/tools.env and ROOTDIR defaults to
# `git rev-parse`, which is empty when .git is masked (hideGit / worktree runs).
validationCommand: ROOTDIR=/workspace make precommit
testCommand: ROOTDIR=/workspace make test
workflow: direct
env:
  GOPATH: /home/node/go
  GOCACHE: /home/node/.cache/go-build
  GOLANGCI_LINT_CACHE: /home/node/.cache/golangci-lint
extraMounts:
  - src: ${GOPATH}/pkg
    dst: /home/node/go/pkg
  - src: ${HOST_CACHE_DIR}/go-build
    dst: /home/node/.cache/go-build
  - src: ${HOST_CACHE_DIR}/golangci-lint
    dst: /home/node/.cache/golangci-lint
