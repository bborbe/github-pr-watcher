name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Branch protection on master requires a check named "test".
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Trivy
        run: |
          # The apt-repo path used the retired keyring helper, which the current
          # ubuntu-latest image no longer ships (`command not found` on every run
          # from 2026-11-14). The upstream install script needs no keyring and
          # pins nothing else in this workflow.
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
      - name: Run precommit checks
        env:
          RACE: "false"
        run: make precommit
